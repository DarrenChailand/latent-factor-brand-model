[project]
name = "latent-factor-brand-model"
version = "1.0.0"
description = "A reproducible brand-perception pipeline using PPMI and SVD"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
